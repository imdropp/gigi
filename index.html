    const JIMIZINHO = document.getElementById("JIMIZINHO")
    const jannizinha = document.getElementById("jannizinha")
    const jimi = document.getElementById("jimi");
    const jannis = document.getElementById("jannis");
    const fotosDiv = document.getElementById("fotos");
    const fotos = [
      "imagens/a.png", "imagens/b.jpeg", "imagens/c.png", "imagens/d.png", "imagens/e.png", "imagens/f.png", "imagens/g.png", "imagens/h.png"
    ]; 

    fotos.forEach((src, index) => {
        setTimeout(() => {
            const img = document.createElement("img"); // cria a imagem
            img.src = src;                             // define o caminho
            img.className = "foto";                    // aplica o estilo
            fotosDiv.appendChild(img);                 // adiciona na página
            jimi.style.opacity = 1;
            jannis.style.opacity = 1;
            jannizinha.style.opacity = 1;
            JIMIZINHO.style.opacity = 1;

            // faz aparecer devagar
            setTimeout(() => { img.style.opacity = 1; }, 50);
        }, index * 500); // cada foto aparece com 0,5s de diferença
    });
}
</script>
